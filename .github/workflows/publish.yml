name: publish

# Publishes a release to PyPI with trusted publishing (OpenID Connect): no password or token is stored anywhere.
# PyPI side, once: pypi.org -> Publishing -> pending publisher: project "detectability", owner "mukremin-nergiz",
# repository "detectability", workflow "publish.yml", environment "pypi".

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: pip install dist/*.whl pytest && pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/detectability
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
