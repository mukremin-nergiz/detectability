[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "detectability"
version = "0.2.0"
description = "Pre-survey detectability, modelled and reproducible: forward-modelled gravity and magnetic responses, station spacing and a detectability verdict for near-surface targets."
readme = "README.md"
keywords = ["geophysics", "gravity", "magnetics", "survey design", "near-surface", "forward modelling", "IGRF"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [{ name = "Mükremin Nergiz" }]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://detectability.mukreminnergiz.com"
Repository = "https://github.com/mukremin-nergiz/detectability"

[project.optional-dependencies]
test = ["pytest>=7"]
# Recomputes the "Independent code" reference values (tools/harmonica_reference.py); not needed to use the library.
validation = ["harmonica==0.7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
detectability = ["data/*.txt", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
